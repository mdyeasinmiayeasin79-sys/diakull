<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>বন্ধু — অনলাইন আয় ও কাজ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: #fff;
    }

    header {
      background: #0759c9;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: .9;
    }

    .balance {
      margin: 20px;
      padding: 22px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0759c9, #1687ff);
      color: white;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }

    .balance small {
      font-size: 14px;
    }

    .balance h2 {
      font-size: 34px;
      margin: 8px 0;
    }

    .withdraw {
      display: inline-block;
      background: white;
      color: #0759c9;
      padding: 10px 22px;
      border-radius: 25px;
      font-weight: bold;
      text-decoration: none;
      margin-top: 8px;
    }

    .section {
      padding: 0 20px 20px;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .tasks {
      display: grid;
      gap: 12px;
    }

    .task {
      border: 1px solid #e1e5eb;
      border-radius: 15px;
      padding: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
    }

    .task-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      background: #eaf2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .task h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .task p {
      font-size: 13px;
      color: #777;
    }

    .earn {
      background: #0759c9;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    nav {
      position: sticky;
      bottom: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
    }

    nav a {
      text-decoration: none;
      color: #555;
      text-align: center;
      font-size: 12px;
    }

    nav span {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>বন্ধু 🤝</h1>
    <p>অনলাইন আয় ও কাজ</p>
  </header>

  <div class="balance">
    <small>আপনার ব্যালেন্স</small>
    <h2>৳ 0.00</h2>
    <a href="#" class="withdraw">টাকা উত্তোলন</a>
  </div>

  <div class="section">
    <h2>আজকের কাজ 🎯</h2>

    <div class="tasks">

      <div class="task">
        <div class="task-info">
          <div class="icon">▶️</div>
          <div>
            <h3>ভিডিও দেখুন</h3>
            <p>ভিডিও দেখে পুরস্কার পান</p>
          </div>
        </div>
        <button class="earn">৳৫</button>
      </div>

      <div class="task">
        <div class="task-info">
          <div class="icon">🌐</div>
          <div>
            <h3>ওয়েবসাইট ভিজিট</h3>
            <p>ওয়েবসাইট ভিজিট করে আয় করুন</p>
          </div>
        </div>
        <button class="earn">৳৩</button>
      </div>

      <div class="task">
        <div class="task-info">
          <div class="icon">📱</div>
          <div>
            <h3>সহজ কাজ</h3>
            <p>নতুন কাজের তালিকা দেখুন</p>
          </div>
        </div>
        <button class="earn">শুরু</button>
      </div>

    </div>
  </div>

  <nav>
    <a href="#">
      <span>🏠</span>
      হোম
    </a>

    <a href="#">
      <span>🎯</span>
      কাজ
    </a>

    <a href="#">
      <span>💰</span>
      আয়
    </a>

    <a href="#">
      <span>👤</span>
      প্রোফাইল
    </a>
  </nav>

</div>

</body>
  </html>
