<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>বন্ধু — অনলাইন আয় ও কাজ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: #fff;
    }

    header {
      background: #0759c9;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.95;
    }

    .balance {
      margin: 18px 15px;
      padding: 20px;
      border-radius: 15px;
      background: linear-gradient(135deg, #0759c9, #1689ff);
      color: white;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    }

    .balance small {
      font-size: 14px;
    }

    .balance h2 {
      font-size: 32px;
      margin-top: 7px;
    }

    .section-title {
      padding: 10px 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .task {
      margin: 12px 15px;
      padding: 17px;
      border: 1px solid #e1e6ed;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .task h3 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .task p {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .earn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      background: #0759c9;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .earn:active {
      transform: scale(0.98);
    }

    .withdraw {
      margin: 20px 15px;
      padding: 18px;
      text-align: center;
      border-radius: 14px;
      background: #f0f6ff;
    }

    .withdraw h3 {
      margin-bottom: 8px;
    }

    .withdraw button {
      margin-top: 10px;
      padding: 11px 25px;
      border: none;
      border-radius: 9px;
      background: #0759c9;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    footer {
      margin-top: 25px;
      padding: 20px;
      text-align: center;
      background: #0759c9;
      color: white;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>বন্ধু</h1>
      <p>অনলাইন আয় ও কাজ</p>
    </header>

    <div class="balance">
      <small>আপনার ব্যালেন্স</small>
      <h2>৳ 0.00</h2>
    </div>

    <div class="section-title">
      available কাজ
    </div>

    <div class="task">
      <h3>🎬 ভিডিও দেখুন</h3>
      <p>ভিডিও দেখে আয় করার সুযোগ</p>
      <button class="earn">কাজ শুরু করুন</button>
    </div>

    <div class="task">
      <h3>🌐 ওয়েবসাইট ভিজিট</h3>
      <p>ওয়েবসাইট ভিজিট করে আয় করুন</p>
      <button class="earn">কাজ শুরু করুন</button>
    </div>

    <div class="task">
      <h3>🎯 নতুন কাজ</h3>
      <p>নতুন কাজ শীঘ্রই যোগ করা হবে</p>
      <button class="earn">কাজ শুরু করুন</button>
    </div>

    <div class="withdraw">
      <h3>💰 টাকা উত্তোলন</h3>
      <p>আপনার ব্যালেন্স জমা হলে টাকা উত্তোলন করতে পারবেন।</p>
      <button onclick="withdrawMoney()">উত্তোলন করুন</button>
    </div>

    <footer>
      © 2026 বন্ধু — অনলাইন আয় ও কাজ
    </footer>

  </div>

  <script>
    document.querySelectorAll(".earn").forEach(function(button) {

      button.addEventListener("click", function() {

        const task = button.parentElement
          .querySelector("h3").innerText;

        if (task.includes("ভিডিও")) {
          alert("🎬 ভিডিও টাস্ক শীঘ্রই চালু হবে ❤️");
        }

        else if (task.includes("ওয়েবসাইট")) {
          alert("🌐 ওয়েবসাইট ভিজিট টাস্ক শীঘ্রই চালু হবে");
        }

        else {
          alert("🎯 নতুন কাজ শীঘ্রই যোগ করা হবে");
        }

      });

    });

    function withdrawMoney() {
      alert("💰 টাকা উত্তোলনের সুবিধা শীঘ্রই চালু হবে।");
    }
  </script>

</body>
      </html>
